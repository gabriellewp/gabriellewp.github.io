<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-size: 2.5rem;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .start-btn {
            background: #4CAF50;
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .start-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 8px 15px;
            font-size: 0.9rem;
            background: #2196F3;
            color: white;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }

        .difficulty-btn:hover {
            background: #0b7dda;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
        }

        .difficulty-btn.active {
            background: #ff9800;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }

        .stats {
            color: white;
            font-size: 1.1rem;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .game-board {
            display: grid;
            gap: 15px;
            margin: 30px auto;
            max-width: 500px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .grid-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .grid-6 {
            grid-template-columns: repeat(6, 1fr);
            max-width: 600px;
        }

        .card {
            width: 100%;
            aspect-ratio: 1;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: bold;
            font-size: 2rem;
            cursor: pointer;
        }

        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid white;
            color: white;
        }

        .card-front:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .card-back {
            background: white;
            transform: rotateY(180deg);
            color: #333;
            user-select: none;
        }

        .card.matched .card-front,
        .card.matched .card-back {
            background: #4CAF50;
            color: white;
            border-color: #45a049;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .modal-content p {
            color: #666;
            font-size: 1.1rem;
            margin: 15px 0;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .modal-btn-primary {
            background: #4CAF50;
            color: white;
        }

        .modal-btn-primary:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .modal-btn-secondary {
            background: #f44336;
            color: white;
        }

        .modal-btn-secondary:hover {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.3);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #333;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            color: #f44336;
            transform: rotate(90deg);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .modal-content {
            position: relative;
        }

        .difficulty-info {
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            color: #666;
            font-size: 0.95rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .game-board {
                max-width: 100%;
                padding: 15px;
                gap: 10px;
            }

            .card-front,
            .card-back {
                font-size: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .modal-content {
                padding: 30px 20px;
                margin: 20px;
                max-width: 90%;
            }

            .close-btn {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Memory Card Game</h1>
        
        <div class="button-group">
            <button class="start-btn" onclick="openStartModal()">Start Game</button>
            <button class="start-btn" onclick="openPortfolioModal()" style="background: #9c27b0;">My Portfolio</button>
        </div>

        <div class="stats">
            <p>Moves: <span id="moves">0</span> | Matched: <span id="matched">0</span>/<span id="total">0</span></p>
        </div>

        <div class="game-board" id="gameBoard"></div>
    </div>

    <!-- Start Game Modal -->
    <div id="startModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeStartModal()">&times;</button>
            <h2>Select Difficulty</h2>
            <div class="difficulty-buttons">
                <button class="difficulty-btn active" onclick="selectDifficulty('easy')">Easy</button>
                <button class="difficulty-btn" onclick="selectDifficulty('medium')">Medium</button>
                <button class="difficulty-btn" onclick="selectDifficulty('hard')">Hard</button>
            </div>
            <div class="difficulty-info" id="difficultyInfo">
                <p>4x4 Grid | 8 Pairs | Perfect for beginners</p>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-primary" onclick="startGame()">Play Game</button>
                <button class="modal-btn modal-btn-secondary" onclick="closeStartModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <button class="close-btn" onclick="closeGameOverModal()">&times;</button>
            <h2>🎉 You Won!</h2>
            <p id="finalStats"></p>
            
            <!-- Portfolio Fact Reveal -->
            <div id="factReveal" style="margin: 25px 0; padding: 20px; border-radius: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                <div style="font-size: 2.5rem; margin-bottom: 10px;" id="factIcon">🎓</div>
                <div style="font-size: 0.85rem; opacity: 0.9; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;" id="factCategory">New Discovery!</div>
                <div style="font-size: 1rem; line-height: 1.6;" id="factText"></div>
            </div>
            
            <div style="margin: 15px 0; color: #666; font-size: 0.95rem;">
                <strong>Progress:</strong> <span id="factProgress">0/18</span> facts discovered
            </div>
            
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-primary" onclick="openStartModal()">Play Again</button>
                <button class="modal-btn" onclick="openPortfolioModal()" style="background: #9c27b0; color: white;">View All Facts</button>
                <button class="modal-btn modal-btn-secondary" onclick="closeGameOverModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Portfolio Modal -->
    <div id="portfolioModal" class="modal">
        <div class="modal-content" style="max-width: 700px; max-height: 85vh; overflow-y: auto;">
            <button class="close-btn" onclick="closePortfolioModal()">&times;</button>
            <h2 style="margin-bottom: 10px;">📚 My Portfolio</h2>
            <p style="color: #666; margin-bottom: 20px;">Discover facts about me by playing the memory game!</p>
            
            <div style="margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px;">
                <strong>Progress:</strong> <span id="portfolioProgress">0/18</span> facts discovered
            </div>
            
            <div id="portfolioContent"></div>
            
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-primary" onclick="closePortfolioModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Portfolio Facts Data
        const portfolioFacts = [
            // Education (4 facts)
            { id: 1, category: 'education', icon: '🎓', fact: "I have a Master's degree (M.Sc.) in Informatics from Technical University of Munich, Germany (2017-2020)" },
            { id: 2, category: 'education', icon: '🎓', fact: "My Master's thesis was on 'Visualization of Semantically Meaningful Representations of Large Multi-dimensional Time Series on Supercomputers'" },
            { id: 3, category: 'education', icon: '🎓', fact: "I have a Bachelor's degree (B.Sc.) in Computer Science from Bandung Institute of Technology (ITB), Indonesia (2010-2015)" },
            { id: 4, category: 'education', icon: '🎓', fact: "My Bachelor's thesis was on 'MemcacheDB Persistent Implementation using LevelDB'" },
            
            // Work Experience (8 facts)
            { id: 5, category: 'work', icon: '💼', fact: "I'm currently a Research Engineer at the Information Retrieval Lab, University of Amsterdam, Netherlands (since April 2023)" },
            { id: 6, category: 'work', icon: '💼', fact: "I work on projects like web-based annotation platforms for fairness in ranking (AnnoRank), intent prediction in conversational LLMs, and sparse/dense retrieval" },
            { id: 7, category: 'work', icon: '💼', fact: "I've experimented with diffusion-guided image captioning using visual language pretraining models and Q-Former" },
            { id: 8, category: 'work', icon: '💼', fact: "I was a Research Assistant at the High Performance Computing Group, University of Basel, Switzerland (2021-2022)" },
            { id: 9, category: 'work', icon: '💼', fact: "I contributed to the EU Horizon 2020 DAPHNE project, optimizing task scheduling in data analysis pipelines" },
            { id: 10, category: 'work', icon: '💼', fact: "I worked as a Student Software Developer at Intel, Germany (2017-2019), building IoT MQTT Gateway modules for the Open IoT Service Platform" },
            { id: 11, category: 'work', icon: '💼', fact: "I was a Software Engineer at the Microelectronics Center, ITB, Indonesia (2016-2017), working on e-Healthcare smart card systems" },
            { id: 12, category: 'work', icon: '💼', fact: "I was an Intern at BlackBerry Innovation Center, Indonesia (2014-2015), developing smart energy and building automation using Android and machine learning" },
            
            // Skills (3 facts)
            { id: 13, category: 'skills', icon: '🛠️', fact: "My tech stack includes: Python, PyTorch, LLMs, C++, JavaScript, Docker, SLURM, Kafka, and web prototyping" },
            { id: 14, category: 'skills', icon: '🛠️', fact: "I have experience with HPC (High-Performance Computing), MPI, LLVM MLIR compiler, and cluster management" },
            { id: 15, category: 'skills', icon: '🛠️', fact: "I speak Indonesian (Native), English (Fluent), German (A2.2), and Dutch (A2.1)" },
            
            // Extra (3 facts)
            { id: 16, category: 'extra', icon: '🏆', fact: "I was the Program Logistics Lead for ELLIS European Summer School on Information Retrieval (ESSIR 2024)" },
            { id: 17, category: 'extra', icon: '🏆', fact: "I completed the NVIDIA Fundamentals of Deep Learning for Computer Vision certification (2019)" },
            { id: 18, category: 'extra', icon: '🏆', fact: "I attended the ELLIS Winter School on Foundation Models at University of Amsterdam (2023)" }
        ];

        // Category styling
        const categoryStyles = {
            education: { color: '#9c27b0', name: 'Education' },
            work: { color: '#2196F3', name: 'Work Experience' },
            skills: { color: '#ff9800', name: 'Skills' },
            extra: { color: '#4CAF50', name: 'Achievements' }
        };

        // LocalStorage functions
        function getDiscoveredFacts() {
            const discovered = localStorage.getItem('discoveredFacts');
            return discovered ? JSON.parse(discovered) : [];
        }

        function discoverFact(id) {
            const discovered = getDiscoveredFacts();
            if (!discovered.includes(id)) {
                discovered.push(id);
                localStorage.setItem('discoveredFacts', JSON.stringify(discovered));
                return true; // New discovery
            }
            return false; // Already discovered
        }

        function getRandomUndiscoveredFact() {
            const discovered = getDiscoveredFacts();
            const undiscovered = portfolioFacts.filter(fact => !discovered.includes(fact.id));
            
            if (undiscovered.length > 0) {
                return undiscovered[Math.floor(Math.random() * undiscovered.length)];
            } else {
                // All discovered, return random fact
                return portfolioFacts[Math.floor(Math.random() * portfolioFacts.length)];
            }
        }

        function updateProgressDisplays() {
            const discovered = getDiscoveredFacts();
            const progressText = `${discovered.length}/18`;
            
            const factProgress = document.getElementById('factProgress');
            const portfolioProgress = document.getElementById('portfolioProgress');
            
            if (factProgress) factProgress.textContent = progressText;
            if (portfolioProgress) portfolioProgress.textContent = progressText;
        }

        // Modal functions for Portfolio
        function openPortfolioModal() {
            renderPortfolioContent();
            updateProgressDisplays();
            document.getElementById('portfolioModal').classList.add('show');
        }

        function closePortfolioModal() {
            document.getElementById('portfolioModal').classList.remove('show');
        }

        function renderPortfolioContent() {
            const discovered = getDiscoveredFacts();
            const content = document.getElementById('portfolioContent');
            
            // Group facts by category
            const categories = ['education', 'work', 'skills', 'extra'];
            let html = '';
            
            categories.forEach(category => {
                const categoryFacts = portfolioFacts.filter(f => f.category === category);
                const categoryStyle = categoryStyles[category];
                
                html += `
                    <div style="margin-bottom: 25px;">
                        <h3 style="color: ${categoryStyle.color}; margin-bottom: 15px; font-size: 1.2rem;">
                            ${categoryFacts[0].icon} ${categoryStyle.name}
                        </h3>
                        <div style="display: flex; flex-direction: column; gap: 12px;">
                `;
                
                categoryFacts.forEach(fact => {
                    const isDiscovered = discovered.includes(fact.id);
                    
                    if (isDiscovered) {
                        html += `
                            <div style="padding: 15px; background: ${categoryStyle.color}15; border-left: 4px solid ${categoryStyle.color}; border-radius: 8px; font-size: 0.95rem; line-height: 1.6;">
                                ${fact.fact}
                            </div>
                        `;
                    } else {
                        html += `
                            <div style="padding: 15px; background: #f5f5f5; border-left: 4px solid #ddd; border-radius: 8px; color: #999; font-size: 0.95rem; display: flex; align-items: center; gap: 10px;">
                                <span style="font-size: 1.2rem;">🔒</span>
                                <span style="font-style: italic;">Play the game to unlock this fact</span>
                            </div>
                        `;
                    }
                });
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            content.innerHTML = html;
        }

        let cards = [];
        let flipped = [];
        let matched = 0;
        let moves = 0;
        let gameActive = false;
        let selectedDifficulty = 'easy';

        const difficulties = {
            easy: { rows: 4, cols: 4, pairs: 8, info: '4x4 Grid | 8 Pairs | Perfect for beginners' },
            medium: { rows: 4, cols: 6, pairs: 12, info: '4x6 Grid | 12 Pairs | More challenging' },
            hard: { rows: 6, cols: 6, pairs: 18, info: '6x6 Grid | 18 Pairs | Expert level' }
        };

        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐤'];

        function openStartModal() {
            document.getElementById('startModal').classList.add('show');
        }

        function closeStartModal() {
            document.getElementById('startModal').classList.remove('show');
        }

        function closeGameOverModal() {
            document.getElementById('gameOverModal').classList.remove('show');
        }

        function selectDifficulty(level) {
            selectedDifficulty = level;
            const buttons = document.querySelectorAll('.difficulty-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('difficultyInfo').innerHTML = `<p>${difficulties[level].info}</p>`;
        }

        function startGame() {
            closeStartModal();
            initializeGame();
            gameActive = true;
        }

        function initializeGame() {
            const difficulty = difficulties[selectedDifficulty];
            cards = [];
            flipped = [];
            matched = 0;
            moves = 0;
            gameActive = true;

            // Create card pairs
            const pairs = difficulty.pairs;
            const cardEmojis = emojis.slice(0, pairs);
            cardEmojis.forEach(emoji => {
                cards.push(emoji);
                cards.push(emoji);
            });

            // Shuffle cards
            cards = cards.sort(() => Math.random() - 0.5);

            // Create game board
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.className = 'game-board ' + (selectedDifficulty === 'easy' ? 'grid-4' : 'grid-6');
            gameBoard.innerHTML = '';

            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">?</div>
                        <div class="card-back">${emoji}</div>
                    </div>
                `;
                card.onclick = () => flipCard(index);
                gameBoard.appendChild(card);
            });

            updateStats();
        }

        function flipCard(index) {
            if (!gameActive || flipped.length >= 2 || flipped.includes(index)) return;

            const card = document.querySelectorAll('.card')[index];
            card.classList.add('flipped');
            flipped.push(index);

            if (flipped.length === 2) {
                gameActive = false;
                moves++;
                updateStats();
                checkMatch();
            }
        }

        function checkMatch() {
            const [first, second] = flipped;
            const isMatch = cards[first] === cards[second];

            setTimeout(() => {
                if (isMatch) {
                    document.querySelectorAll('.card')[first].classList.add('matched');
                    document.querySelectorAll('.card')[second].classList.add('matched');
                    matched++;
                    updateStats();
                    flipped = [];
                    gameActive = true;

                    // Check if game is won
                    const difficulty = difficulties[selectedDifficulty];
                    if (matched === difficulty.pairs) {
                        gameActive = false;
                        showGameOverModal();
                    }
                } else {
                    document.querySelectorAll('.card')[first].classList.remove('flipped');
                    document.querySelectorAll('.card')[second].classList.remove('flipped');
                    flipped = [];
                    gameActive = true;
                }
            }, 600);
        }

        function updateStats() {
            const difficulty = difficulties[selectedDifficulty];
            document.getElementById('moves').textContent = moves;
            document.getElementById('matched').textContent = matched;
            document.getElementById('total').textContent = difficulty.pairs;
        }

        function showGameOverModal() {
            // Get a random undiscovered fact
            const fact = getRandomUndiscoveredFact();
            const isNew = discoverFact(fact.id);
            const categoryStyle = categoryStyles[fact.category];
            
            // Update fact display
            document.getElementById('factIcon').textContent = fact.icon;
            document.getElementById('factCategory').textContent = isNew ? 'New Discovery!' : categoryStyle.name;
            document.getElementById('factText').textContent = fact.fact;
            
            // Update fact card background color
            const factReveal = document.getElementById('factReveal');
            factReveal.style.background = `linear-gradient(135deg, ${categoryStyle.color} 0%, ${categoryStyle.color}dd 100%)`;
            
            // Add celebration animation for new discoveries
            if (isNew) {
                factReveal.style.animation = 'none';
                setTimeout(() => {
                    factReveal.style.animation = 'pulse 0.5s ease-in-out';
                }, 10);
            }
            
            // Update progress
            updateProgressDisplays();
            
            // Check if all facts discovered
            const discovered = getDiscoveredFacts();
            const allDiscovered = discovered.length === portfolioFacts.length;
            
            if (allDiscovered && isNew) {
                document.getElementById('factCategory').textContent = '🎊 Collection Complete! 🎊';
            }
            
            // Show stats
            document.getElementById('finalStats').innerHTML = `
                <p>You completed the game in <strong>${moves} moves</strong></p>
                <p>Difficulty: <strong>${selectedDifficulty.charAt(0).toUpperCase() + selectedDifficulty.slice(1)}</strong></p>
            `;
            
            document.getElementById('gameOverModal').classList.add('show');
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            const startModal = document.getElementById('startModal');
            const gameOverModal = document.getElementById('gameOverModal');
            const portfolioModal = document.getElementById('portfolioModal');
            
            if (event.target === startModal) {
                closeStartModal();
            }
            if (event.target === gameOverModal) {
                closeGameOverModal();
            }
            if (event.target === portfolioModal) {
                closePortfolioModal();
            }
        }
    </script>
</body>
</html>
